<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kedi yakala – Oyun Odası</title>
<meta name="description" content="Gökten düşen kedileri yakala. Telefonda ve bilgisayarda ücretsiz oyna.">
<meta property="og:title" content="Kedi yakala – Oyun Odası">
<meta property="og:description" content="Gökten düşen kedileri yakala. Ücretsiz tarayıcı oyunu.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#141821">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141821'/%3E%3Cpolygon points='6,14 9,5 14,12 18,12 23,5 26,14 26,26 6,26' fill='%23e08a2b'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#141821;color:#f2efe6;font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 32px}
header{padding:20px 0 8px;display:flex;justify-content:space-between;align-items:center}
.logo{font:700 20px/1 ui-monospace,"Courier New",monospace;letter-spacing:.5px;color:#e08a2b;text-decoration:none}
.back{color:#a7b0bf;text-decoration:none;font-size:15px}
.back:hover{color:#f2efe6}
h1{font:700 24px/1.2 ui-monospace,"Courier New",monospace;margin:12px 0 4px}
.hud{display:flex;justify-content:space-between;color:#a7b0bf;font-size:15px;margin:12px 0 8px}
.hud b{color:#f2efe6;font:700 18px ui-monospace,"Courier New",monospace}
canvas{width:100%;display:block;border:2px solid #2f3a4d;touch-action:none;user-select:none;-webkit-user-select:none}
.ctl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
button{height:60px;background:#1f2530;color:#f2efe6;border:2px solid #2f3a4d;font:700 18px ui-monospace,"Courier New",monospace;box-shadow:4px 4px 0 #000;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
button:active{background:#2f3a4d;transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.restart{width:100%;margin-top:16px;height:48px;font-size:16px}
.hint{color:#a7b0bf;font-size:14px;margin:16px 0 0}
</style>
</head>
<body>
<div class="wrap">
<header>
<a class="logo" href="./">OYUN ODASI</a>
<a class="back" href="./">← Tüm oyunlar</a>
</header>
<h1>Kedi yakala</h1>
<div class="hud"><span>Puan <b id="sc">0</b></span><span>En iyi <b id="bs">0</b></span><span>Can <b id="lv">3</b></span></div>
<canvas id="c" width="760" height="800" aria-label="Kedi yakalama oyunu"></canvas>
<div class="ctl">
<button id="l" type="button" aria-label="Sola git">← Sol</button>
<button id="r" type="button" aria-label="Sağa git">Sağ →</button>
</div>
<button id="rs" class="restart" type="button">Yeniden başla</button>
<p class="hint">Telefonda: düğmelere basılı tut ya da ekranda parmağını sürükle. Bilgisayarda: ok tuşları ya da A ve D.</p>
</div>
<script>
const $=id=>document.getElementById(id);
const c=$('c'),x=c.getContext('2d');x.scale(2,2);
const W=380,H=400,G=340;
let st='ready',score=0,best=0,lives=3,mx=190,dir=0,tgt=null,cats=[],spawn=0.5,last=0,walk=0;
try{best=+localStorage.getItem('kedi_best')||0}catch(e){}
function save(){try{localStorage.setItem('kedi_best',String(best))}catch(e){}}
function upd(){$('sc').textContent=score;$('bs').textContent=best;$('lv').textContent=lives;}
function reset(){score=0;lives=3;cats=[];spawn=0.5;mx=190;tgt=null;upd();}
function begin(){if(st!=='play'){reset();st='play';}}
function poly(p,col){x.fillStyle=col;x.beginPath();x.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)x.lineTo(p[i],p[i+1]);x.closePath();x.fill();}
function drawCat(cx,cy,r){
x.save();x.translate(cx,cy);x.rotate(r);
poly([-24,-6,-18,-18,-14,-14,-14,0],'#b8651a');
poly([-14,-6,10,-6,14,10,-16,10],'#e08a2b');
poly([-6,-6,-2,-6,-2,10,-6,10],'#b8651a');
poly([4,-6,8,-6,9,10,5,10],'#b8651a');
poly([6,-18,24,-18,26,-4,8,-2],'#e08a2b');
poly([6,-18,10,-27,15,-18],'#e08a2b');
poly([17,-18,23,-27,26,-18],'#e08a2b');
x.fillStyle='#1f1a10';x.fillRect(11,-12,3,4);x.fillRect(19,-12,3,4);
x.restore();}
function drawMan(){
const s=Math.sin(walk)*7;
poly([mx-12,G-40,mx-2,G-40,mx-2+s,G,mx-14+s,G],'#2c2f3a');
poly([mx+2,G-40,mx+12,G-40,mx+14-s,G,mx+2-s,G],'#20232d');
poly([mx-16+s,G,mx-1+s,G,mx+1+s,G+6,mx-16+s,G+6],'#111');
poly([mx+1-s,G,mx+16-s,G,mx+16-s,G+6,mx-1-s,G+6],'#111');
poly([mx-14,G-85,mx+14,G-85,mx+16,G-38,mx-16,G-38],'#3b5b8c');
poly([mx-14,G-82,mx-36,G-112,mx-30,G-118,mx-10,G-92],'#34527e');
poly([mx+14,G-82,mx+36,G-112,mx+30,G-118,mx+10,G-92],'#34527e');
poly([mx-38,G-110,mx-28,G-120,mx-26,G-112,mx-34,G-104],'#e0ac8a');
poly([mx+38,G-110,mx+28,G-120,mx+26,G-112,mx+34,G-104],'#e0ac8a');
poly([mx-11,G-112,mx-7,G-122,mx+7,G-122,mx+11,G-112,mx+10,G-92,mx-10,G-92],'#e0ac8a');
poly([mx-12,G-112,mx-8,G-125,mx+8,G-125,mx+12,G-112,mx,G-117],'#3a2a1e');
x.fillStyle='#111';x.fillRect(mx-6,G-110,3,4);x.fillRect(mx+3,G-110,3,4);
x.fillStyle='#a8493a';x.fillRect(mx-4,G-100,8,2);}
function scene(){
x.fillStyle='#a9c1cf';x.fillRect(0,0,W,G);
poly([300,40,322,30,344,40,344,62,322,72,300,62],'#f3e3a6');
poly([10,G,10,230,40,218,70,230,70,G],'#6f7f93');
poly([90,G,90,200,130,188,130,G],'#6f7f93');
poly([150,G,150,240,190,225,230,240,230,G],'#6f7f93');
poly([250,G,250,210,290,198,290,G],'#6f7f93');
poly([310,G,310,245,340,235,370,245,370,G],'#6f7f93');
x.fillStyle='#4f5d70';
[[22,250],[48,250],[100,220],[100,255],[165,260],[195,260],[262,230],[262,265],[322,265]].forEach(p=>x.fillRect(p[0],p[1],10,10));
x.fillStyle='#4a4a52';x.fillRect(0,G,W,H-G);
x.fillStyle='#8d8d96';x.fillRect(0,G,W,4);
x.fillStyle='#d8d29a';for(let i=0;i<5;i++)x.fillRect(i*80+20,G+34,40,4);}
function overlay(t1,t2){
x.fillStyle='rgba(30,40,60,0.6)';x.fillRect(0,0,W,H);
x.fillStyle='#ffffff';x.textAlign='center';
x.font='700 24px sans-serif';x.fillText(t1,W/2,170);
x.font='400 15px sans-serif';x.fillText(t2,W/2,205);}
function draw(){
scene();
for(const k of cats)drawCat(k.x,k.y,k.r);
drawMan();
if(st==='ready')overlay('Kedileri yakala','Başlamak için dokun');
if(st==='over')overlay('Oyun bitti','Puan: '+score+' · yeniden başlamak için dokun');}
function frame(t){
const dt=Math.min((t-last)/1000||0,0.05);last=t;
if(st==='play'){
let move=dir*260*dt;
if(tgt!==null){const d=tgt-mx;move+=Math.sign(d)*Math.min(Math.abs(d),400*dt);}
mx=Math.max(40,Math.min(W-40,mx+move));
if(Math.abs(move)>0.1)walk+=dt*14;
spawn-=dt;
if(spawn<=0){cats.push({x:24+Math.random()*(W-48),y:-30,r:Math.random()*0.6-0.3,vr:Math.random()*2-1});spawn=Math.max(0.5,1.1-score*0.02);}
const sp=Math.min(320,120+score*5);
for(const k of cats){
k.y+=sp*dt;k.r+=k.vr*dt;
if(!k.d&&k.y>G-110&&k.y<G-50&&Math.abs(k.x-mx)<40){k.d=1;score++;if(score>best){best=score;save();}upd();}
else if(!k.d&&k.y>G-6){k.d=2;lives--;upd();if(lives<=0)st='over';}}
cats=cats.filter(k=>!k.d);}
draw();requestAnimationFrame(frame);}
function pos(e){const r=c.getBoundingClientRect();return (e.clientX-r.left)/r.width*W;}
function hold(el,d){
el.addEventListener('pointerdown',e=>{e.preventDefault();begin();dir=d;});
['pointerup','pointerleave','pointercancel'].forEach(n=>el.addEventListener(n,()=>{if(dir===d)dir=0;}));
el.addEventListener('contextmenu',e=>e.preventDefault());}
hold($('l'),-1);hold($('r'),1);
c.addEventListener('pointerdown',e=>{begin();tgt=pos(e);c.setPointerCapture(e.pointerId);});
c.addEventListener('pointermove',e=>{if(tgt!==null)tgt=pos(e);});
['pointerup','pointercancel'].forEach(n=>c.addEventListener(n,()=>{tgt=null;}));
$('rs').addEventListener('click',()=>{reset();st='play';});
const LEFT=k=>k==='ArrowLeft'||k==='a'||k==='A';
const RIGHT=k=>k==='ArrowRight'||k==='d'||k==='D';
document.addEventListener('keydown',e=>{
if(LEFT(e.key)){e.preventDefault();begin();dir=-1;}
else if(RIGHT(e.key)){e.preventDefault();begin();dir=1;}
else if(e.key===' '||e.key==='Enter'){if(document.activeElement===document.body){e.preventDefault();begin();}}});
document.addEventListener('keyup',e=>{
if((LEFT(e.key)&&dir===-1)||(RIGHT(e.key)&&dir===1))dir=0;});
upd();requestAnimationFrame(frame);
</script>
</body>
</html>
